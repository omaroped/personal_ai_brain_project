{% extends "base.html" %}

{% block content %}
<div class="auth-container glass-panel">
    <div class="app-icon">
        <i class="fas fa-check-circle" style="color: var(--success);"></i>
    </div>
    <h1 class="logo" style="-webkit-text-fill-color: white; font-size: 28px;">Authorization Successful</h1>
    <p class="auth-desc">
        Your Personal AI Brain has been successfully connected to <strong>{{ app_name }}</strong>.
        You can now close this window or return to the dashboard.
    </p>
    
    <div class="auth-buttons">
        <button onclick="location.href='/'">Go to Dashboard</button>
    </div>
</div>
{% endblock %}
