{% extends "base.html" %}

{% block content %}
<div class="auth-container glass-panel">
    <div class="app-icon">
        <i class="fas fa-plug" style="color: var(--accent-primary);"></i>
    </div>
    <h1 class="logo" style="-webkit-text-fill-color: white; font-size: 28px;">Connect to Brain</h1>
    <p class="auth-desc">
        The application <strong>{{ app_name }}</strong> is requesting secure access to your 
        Personal AI Brain. This allows the app to read and write to your memory vault.
    </p>
    
    <div class="auth-buttons">
        <form action="/auth/approve" method="POST">
            <input type="hidden" name="app_name" value="{{ app_name }}">
            <input type="hidden" name="redirect_uri" value="{{ redirect_uri }}">
            <button type="submit">Approve Connection</button>
        </form>
        <button class="secondary" onclick="location.href='/'">Cancel</button>
    </div>
    
    <p style="font-size: 11px; color: var(--text-dim); margin-top: 24px;">
        <i class="fas fa-shield-alt"></i> Local encryption active. Your data stays on this PC.
    </p>
</div>
{% endblock %}
